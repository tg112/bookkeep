<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book — Bookkeep</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/book.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <a href="index.html" class="header-logo">Bookkeep</a>
      </div>
    </header>

    <main class="container" id="main-content">
      <div class="toolbar">
        <a href="index.html" class="btn btn-secondary">← Back</a>
      </div>

      <div id="book-detail"></div>

      <section id="notes" class="notes-section card" hidden>
        <h2 class="detail-section-label">Notes</h2>

        <form id="note-form" class="note-form">
          <textarea
            id="note-content"
            class="note-textarea"
            placeholder="Add a note, quote, or study comment…"
            rows="3"
            required
          ></textarea>
          <div class="note-form-row">
            <input
              id="note-page"
              class="note-page-input"
              type="number"
              min="1"
              placeholder="Page (optional)"
            />
            <button type="submit" class="btn">Add Note</button>
          </div>
        </form>

        <ul id="notes-list" class="notes-list"></ul>
      </section>
    </main>

    <script type="module" src="js/book.js"></script>
  </body>
</html>
