<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Book — Bookkeep</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <a href="index.html" class="header-logo">Bookkeep</a>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <h2 class="section-title">Add Book</h2>
        <a href="index.html" class="btn btn-secondary">← Back</a>
      </div>

      <form id="register-form" class="card form-card" novalidate>
        <div class="form-group">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" name="title" required placeholder="e.g. The Great Gatsby" />
          <span class="field-error" id="title-error"></span>
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" name="author" placeholder="e.g. F. Scott Fitzgerald" />
        </div>

        <div class="form-group">
          <label for="pages">Pages</label>
          <input type="number" id="pages" name="pages" min="1" placeholder="e.g. 320" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add Book</button>
        </div>

        <p class="status-message" id="form-error" hidden></p>
      </form>
    </main>

    <script src="js/register.js"></script>
  </body>
</html>
